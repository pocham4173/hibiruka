name: おでかけスポットの更新
on:
  schedule:
    - cron: '17 18 * * 0'   # 毎週月曜 3:17（日本時間）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/spots-data.cjs
      - .github/workflows/spots-data.yml
permissions:
  contents: write
concurrency:
  group: spots-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/spots-data.test.cjs
      - run: node scripts/spots-data.cjs
      - name: Save the new data
        run: |
          if git diff --quiet -- data/spots-nagano.json && git ls-files --error-unmatch data/spots-nagano.json >/dev/null 2>&1; then echo "No change"; exit 0; fi
          git config user.name "hibiruka-bot"
          git config user.email "hibiruka-bot@users.noreply.github.com"
          git add data/spots-nagano.json
          git commit -m "おでかけスポットのデータを更新"
          git pull --rebase origin main
          git push origin HEAD:main
