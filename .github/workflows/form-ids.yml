name: お問い合わせフォームの項目番号を調べる
on:
  push:
    branches: [main]
    paths: [.github/workflows/form-ids.yml]
permissions:
  contents: read
jobs:
  ids:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          node -e '
          (async()=>{
            const r=await fetch("https://docs.google.com/forms/d/e/1FAIpQLSfUJmj_ja4CkWWw0naho5ML6O4T3MzVJXsnzDG_RRwLUoIIvA/viewform");
            const h=await r.text();
            const m=h.match(/FB_PUBLIC_LOAD_DATA_ = (.*?);<\/script>/s);
            if(!m){console.log("not found",r.status);process.exit(1);}
            const d=JSON.parse(m[1]);
            for(const q of d[1][1]){const t=q[1];const a=q[4]||[];for(const x of a){console.log("::notice::Q="+t+" entry."+x[0]+" req="+x[2]+" opts="+JSON.stringify((x[1]||[]).map(o=>o[0])));}}
          })();'
