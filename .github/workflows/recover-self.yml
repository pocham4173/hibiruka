name: 自分宛ての未送信予約を復旧
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/recover-self.yml]
permissions:
  contents: read
concurrency:
  group: hibiruka-line-sender
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts firebase-admin@12 --omit=dev --no-audit --no-fund
      - name: 写真で確認した自分宛ての1件のみ再処理
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          VALIDATE_ONLY: 'false'
          RECOVER_SELF_AT: '2026-09-28T18:45'
        run: node scripts/send-line.cjs
