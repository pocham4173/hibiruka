name: 予定のLINE送信

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/notify.yml
      - scripts/**
  workflow_dispatch:
    inputs:
      validate_only:
        description: 接続の確認だけを行う（LINEは送信しない）
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: hibiruka-line-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 準備
        run: npm install --prefix scripts firebase-admin@12 --omit=dev --no-audit --no-fund
      - name: 接続確認・予約済み通知の送信
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          VALIDATE_ONLY: 'true'
        run: node scripts/send-line.cjs
