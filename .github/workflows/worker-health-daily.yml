name: LINE送信役の毎日点検と持ち主への通知
on:
  schedule:
    - cron: '17 21 * * *' # 毎日 日本時間6:17（GitHubの都合で遅れる場合あり）
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: hibiruka-worker-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts firebase-admin@12 --omit=dev --no-audit --no-fund
      - name: 動作記録を読む
        id: health
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-worker-health.cjs
      - name: 異常時だけ持ち主へ通知し、回復したら閉じる
        if: always()
        uses: actions/github-script@v7
        env:
          HEALTHY: ${{ steps.health.outputs.healthy }}
          REASON: ${{ steps.health.outputs.reason }}
        with:
          script: |
            const marker = '<!-- hibiruka-worker-health-daily -->';
            const {owner, repo} = context.repo;
            const run = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state:'open', creator:'github-actions[bot]', per_page:100});
            const issue = issues.find(i => !i.pull_request && i.body?.includes(marker));
            const healthy = process.env.HEALTHY === 'true';
            if (!healthy) {
              const reason = process.env.REASON || '点検を実行できませんでした。接続・権限・点検ログを確認してください。';
              const body = `${marker}\nLINE送信役の毎日点検で異常を検知しました。\n\n${reason}\n\n[点検ログ](${run})\n\nこの点検は予定のお知らせを送信しません。復旧を確認すると、このIssueを自動で閉じます。`;
              if (!issue) await github.rest.issues.create({owner, repo, title:'【要確認】ヒビルカのLINE送信役が動作していません', body, assignees:[owner]});
              else await github.rest.issues.update({owner, repo, issue_number:issue.number, body});
              core.setFailed(reason);
            } else if (issue) {
              await github.rest.issues.createComment({owner, repo, issue_number:issue.number, body:`毎日点検で復旧を確認しました。[点検ログ](${run})`});
              await github.rest.issues.update({owner, repo, issue_number:issue.number, state:'closed', state_reason:'completed'});
            }
