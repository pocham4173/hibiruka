name: 非公開化の本番ルール事前検査（読み取り専用）
on:
  push:
    branches: [fix/private-records-20261017]
    paths: [.github/workflows/privacy-preflight.yml, scripts/privacy-preflight.cjs, scripts/legacy-private-rules.cjs, security/legacy-private.test.cjs, security/personal.test.cjs]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --prefix scripts firebase-admin@12 --omit=dev --no-audit --no-fund
      - run: node scripts/privacy-preflight.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm install --prefix security --no-audit --no-fund
      - name: 本番ルールの修正案を架空アカウントで検査
        working-directory: security
        run: ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-hibiruka-isolation 'node --test legacy-private.test.cjs && node --test personal.test.cjs'
