name: ヒビルカ送信の修正反映
on:
  push:
    branches: [main]
    paths:
      - scripts/line-engine.cjs
      - scripts/verify-scheduler.cjs
      - line-worker/**
      - .github/workflows/line-worker-update.yml
permissions:
  contents: read
concurrency:
  group: hibiruka-cloudflare-deploy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c012ff5fddf59148a0f718fc6736d080
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix line-worker --no-audit --no-fund
      - run: npm install --prefix scripts firebase-admin@12 --omit=dev --no-audit --no-fund
      - run: node --test tests/line.test.cjs tests/worker.test.mjs tests/webhook.test.mjs
      - run: npm run build --prefix line-worker
      - name: Deploy without sending
        run: node line-worker/deploy.cjs
        env:
          ENABLE_SENDING: 'false'
      - name: Verify two scheduled dry runs
        run: node scripts/verify-scheduler.cjs
        env:
          EXPECT_ENABLED: 'false'
      - name: Resume existing scheduled reservations
        run: node line-worker/deploy.cjs
        env:
          ENABLE_SENDING: 'true'
      - name: Verify two enabled scheduled runs
        run: node scripts/verify-scheduler.cjs
        env:
          EXPECT_ENABLED: 'true'
      - name: Point LINE Webhook URL at the Worker
        if: always()
        continue-on-error: true
        run: node line-worker/set-webhook.cjs
