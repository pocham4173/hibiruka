name: 記録の公開範囲確認（読み取り専用）
on:
  push:
    branches: [fix/private-records-20261017]
    paths: [.github/workflows/privacy-audit.yml, scripts/privacy-audit.cjs]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts firebase-admin@12 --omit=dev --no-audit --no-fund
      - run: node scripts/privacy-audit.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

