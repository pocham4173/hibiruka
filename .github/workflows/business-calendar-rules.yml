name: ビジネスカレンダーの保存ルール反映
on:
  push:
    branches: [main]
    paths: [security/personal.rules, .github/workflows/business-calendar-rules.yml]
permissions:
  contents: read
concurrency:
  group: hibiruka-rules-deploy
  cancel-in-progress: false
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --prefix scripts firebase-admin@12 --omit=dev --no-audit --no-fund
      - run: npm install --prefix security --no-audit --no-fund
      - run: node scripts/personal-rules.cjs prepare
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Test calendar preservation and account isolation
        working-directory: security
        run: ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-hibiruka-isolation 'node --test personal.test.cjs'
      - name: Deploy only the tested rules
        run: node scripts/personal-rules.cjs deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Verify business saving with temporary accounts, then clean up
        run: NODE_PATH=security/node_modules node scripts/business-calendar-smoke.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
