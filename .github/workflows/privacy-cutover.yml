name: 既存記録を残して本人限定へ切り替え
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/privacy-cutover.yml
permissions:
  contents: read
concurrency:
  group: hibiruka-rules-deploy
  cancel-in-progress: false
jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --prefix scripts firebase-admin@12 --omit=dev --no-audit --no-fund
      - run: npm install --prefix security --no-audit --no-fund
      - run: node --test tests/privacy-cutover.test.cjs tests/privacy-selector.test.cjs tests/legacy-private-rules.test.cjs
      - name: 同じ版のLINE処理が反映され正常に動くまで待つ
        run: node scripts/privacy-cutover.cjs wait-worker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: 本人と最新ルールを再確認（まだ書き込まない）
        run: node scripts/privacy-cutover.cjs prepare
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: 実際のルールの修正案で本人許可・他人拒否を検査
        working-directory: security
        run: ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-hibiruka-isolation 'node --test legacy-private.test.cjs && node --test personal.test.cjs'
      - name: 管理設定を非公開で保全し、記録を移動せず権限を限定
        run: node scripts/privacy-cutover.cjs apply
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: 本番で本人の閲覧・他人の拒否・既存記録の維持を確認
        run: node scripts/privacy-cutover.cjs verify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: 一時的な内部照合ファイルを除去
        if: always()
        run: rm -f /tmp/hibiruka-private-plan.json /tmp/hibiruka-combined.rules
