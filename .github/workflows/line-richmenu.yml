name: LINEメニューの反映
on:
  push:
    branches: [main]
    paths:
      - line-worker/richmenu.cjs
      - line-worker/richmenu.jpg
      - .github/workflows/line-richmenu.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  richmenu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node line-worker/richmenu.cjs
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
