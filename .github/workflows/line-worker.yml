name: LINE定期送信の検査と切替
on:
  push:
    branches: [codex/minute-line-scheduler]
    paths: [line-worker/**, scripts/line-engine.cjs, scripts/send-line.cjs, tests/line.test.cjs, tests/worker.test.mjs, .github/workflows/line-worker.yml]
  workflow_dispatch:
    inputs:
      enable_sending:
        description: 本番の定期確認が成功した後に送信を有効にする
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hibiruka-cloudflare-deploy
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix line-worker --no-audit --no-fund
      - run: node --test tests/line.test.cjs tests/worker.test.mjs
      - run: npm run build --prefix line-worker
      - if: github.event_name == 'workflow_dispatch'
        run: npm install --prefix scripts firebase-admin@12 --omit=dev --no-audit --no-fund
      - if: github.event_name == 'workflow_dispatch'
        run: node line-worker/deploy.cjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          ENABLE_SENDING: ${{ inputs.enable_sending }}
