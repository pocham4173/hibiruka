name: 許可済みの暗号化番号を内部照合（読み取り専用）
on:
  push:
    branches: [fix/private-records-20261017]
    paths: [.github/workflows/privacy-owner-match.yml, scripts/privacy-owner-match.cjs, scripts/privacy-target.sealed.json]
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts firebase-admin@12 --omit=dev --no-audit --no-fund
      - run: node scripts/privacy-owner-match.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
