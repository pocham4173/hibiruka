name: 隔離テスト（本番に触れない）
# 秘密情報を使わない。本番のFirebase・LINE・Cloudflareには一切つながない。
# 権限ルールは「仮の旧ルール（security/legacy-standin.rules）＋ personal.rules」をエミュレーターで検査する。
on:
  push:
    branches: ['claude/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --prefix security --no-audit --no-fund
      - run: npm ci --prefix line-worker --no-audit --no-fund
      - name: アプリ・送信処理・Workerのテスト
        run: NODE_PATH=security/node_modules node --test tests/*.test.cjs tests/*.test.mjs
      - name: 権限ルールのテスト（エミュレーター）
        shell: bash
        run: |
          node security/combine-local.cjs security/legacy-standin.rules
          cd security
          set +e
          ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-hibiruka-isolation 'node --test personal.test.cjs' > /tmp/rules-out.txt 2>&1
          status=$?
          tail -n 40 /tmp/rules-out.txt
          # 失敗の要点を注釈に出す（ログを開けなくても分かるように）
          if [ $status -ne 0 ]; then
            msg=$(grep -E "not ok|Error|error:|expected|actual|Property|Invalid|evaluation|L[0-9]+:" /tmp/rules-out.txt | head -n 30 | cut -c1-220 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=rules tests::${msg}"
          fi
          exit $status
      - name: Workerのビルド確認（公開はしない）
        run: npm run build --prefix line-worker
